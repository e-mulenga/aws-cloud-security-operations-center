name: Security Scan

checkov:
    name: checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Run Checkov SAST
        run: |
          pip install checkov --quiet
          rm -rf checkov.sarif
          checkov -d . --output sarif --output-file checkov.sarif || true
          if [ -d "checkov.sarif" ]; then
            SARIF_FILE=$(find checkov.sarif -name "*.sarif" | head -n 1)
            if [ -n "$SARIF_FILE" ]; then
              cp "$SARIF_FILE" ./checkov_temp.sarif
              rm -rf checkov.sarif
              mv ./checkov_temp.sarif checkov.sarif
            else
              rm -rf checkov.sarif
            fi
          fi
      - name: Ensure valid SARIF exists
        if: always()
        run: |
          if [ ! -f checkov.sarif ] || [ ! -s checkov.sarif ]; then
            echo '{"version": "2.1.0", "runs": [{"tool": {"driver": {"name": "checkov"}}, "results": []}]}' > checkov.sarif
          fi
      - uses: github/codeql-action/upload-sarif@v3.29.5
        if: always()
        continue-on-error: true
        with: { sarif_file: checkov.sarif, category: checkov }