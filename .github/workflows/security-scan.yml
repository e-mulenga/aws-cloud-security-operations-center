name: Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  tfsec:
    name: tfsec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          soft_fail: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
          format: sarif
          output_file: tfsec.sarif
      - uses: github/codeql-action/upload-sarif@v3.29.5
        if: always()
        with: { sarif_file: tfsec.sarif, category: tfsec }

  checkov:
    name: checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: bridgecrewio/checkov-action@v12.3.2
        with: 
          directory: . 
          framework: terraform 
          output_format: sarif 
          output_file_path: checkov.sarif 
          soft_fail: true
      - uses: github/codeql-action/upload-sarif@v3.29.5
        if: always()
        with: { sarif_file: checkov.sarif, category: checkov }

  bandit:
    name: Bandit (Python Lambda SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - run: pip install bandit --quiet
      - run: |
          bandit -r lambda/ -f sarif -o bandit.sarif --severity-level medium || true
      - uses: github/codeql-action/upload-sarif@v3.29.5
        if: always()
        with: { sarif_file: bandit.sarif, category: bandit }

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2.3.9
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

  trivy:
    name: Trivy IaC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: aquasecurity/trivy-action@master
        with: 
          scan-type: config 
          scan-ref: . 
          format: sarif 
          output: trivy.sarif 
          severity: "HIGH,CRITICAL" 
          exit-code: "0"
      - uses: github/codeql-action/upload-sarif@v3.29.5
        if: always()
        with: { sarif_file: trivy.sarif, category: trivy }