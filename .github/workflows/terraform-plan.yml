security-scan:
    name: IaC Security Scan
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          soft_fail: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
          format: sarif
          output_file: tfsec.sarif
      - uses: github/codeql-action/upload-sarif@v3.29.5
        if: always()
        with: { sarif_file: tfsec.sarif, category: tfsec }
      - uses: bridgecrewio/checkov-action@v12.3.2
        with: 
          directory: . 
          framework: terraform 
          output_format: sarif 
          output_file_path: checkov.sarif 
          soft_fail: true
      - uses: github/codeql-action/upload-sarif@v3.29.5
        if: always()
        with: { sarif_file: checkov.sarif, category: checkov }